services:
  server:
    image: twentycrm/twenty:v2.59.0
    restart: unless-stopped
    stop_grace_period: 120s
    mem_limit: 2g
    cpus: 1.0
    environment:
      NODE_ENV: production
      SERVER_URL: https://crm.hyper-tech.vn
      PG_DATABASE_URL: postgres://twenty:${SERVICE_PASSWORD_64_DB}@postgres:5432/twenty
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY}
      APP_SECRET: ${SERVICE_PASSWORD_64_APP}
      STORAGE_TYPE: local
      IS_MULTIWORKSPACE_ENABLED: 'false'
      IS_CONFIG_VARIABLES_IN_DB_ENABLED: 'false'
      AUTH_PASSWORD_ENABLED: 'true'
      EMAIL_DRIVER: logger
      LOGIC_FUNCTION_TYPE: DISABLED
      CODE_INTERPRETER_TYPE: DISABLED
      TELEMETRY_ENABLED: 'false'
      NODE_OPTIONS: --max-old-space-size=1536
      NODE_PORT: 3000
    volumes:
      - twenty-data:/app/packages/twenty-server/.local-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:3000/healthz]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  worker:
    image: twentycrm/twenty:v2.59.0
    restart: unless-stopped
    stop_grace_period: 120s
    mem_limit: 1g
    cpus: 0.75
    command: [yarn, 'worker:prod']
    environment:
      NODE_ENV: production
      SERVER_URL: https://crm.hyper-tech.vn
      PG_DATABASE_URL: postgres://twenty:${SERVICE_PASSWORD_64_DB}@postgres:5432/twenty
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY}
      APP_SECRET: ${SERVICE_PASSWORD_64_APP}
      STORAGE_TYPE: local
      IS_MULTIWORKSPACE_ENABLED: 'false'
      IS_CONFIG_VARIABLES_IN_DB_ENABLED: 'false'
      AUTH_PASSWORD_ENABLED: 'true'
      EMAIL_DRIVER: logger
      LOGIC_FUNCTION_TYPE: DISABLED
      CODE_INTERPRETER_TYPE: DISABLED
      TELEMETRY_ENABLED: 'false'
      NODE_OPTIONS: --max-old-space-size=768
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
    volumes:
      - twenty-data:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_USER: twenty
      POSTGRES_DB: twenty
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_DB}
      TWENTY_ENCRYPTION_KEY: ''
      SERVICE_PASSWORD_64_APP: ''
    volumes:
      - twenty-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U twenty -d twenty]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    command: [redis-server, --maxmemory, 192mb, --maxmemory-policy, noeviction, --appendonly, 'yes']
    environment:
      TWENTY_ENCRYPTION_KEY: ''
      SERVICE_PASSWORD_64_APP: ''
      SERVICE_PASSWORD_64_DB: ''
    volumes:
      - twenty-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  twenty-data:
  twenty-db:
  twenty-redis:
